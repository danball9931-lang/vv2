<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0b0d">
<meta name="color-scheme" content="dark light">
<title>V2 ANALYZER ｜ L 革命機ヴァルヴレイヴ2</title>
<style>
  :root{
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --bg:#08090b;
    --panel:#111417;
    --panel-2:#151a1f;
    --line:#242a32;
    --line-2:#333c47;
    --ink:#e9edf3;
    --muted:#8b95a3;
    --red:#e11d33;
    --red-2:#ff3b4f;
    --cyan:#3ad6ff;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --grid:rgba(255,255,255,.022);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eceef2;
      --panel:#ffffff;
      --panel-2:#f7f8fa;
      --line:#d8dce2;
      --line-2:#c2c8d1;
      --ink:#101318;
      --muted:#5f6873;
      --red:#c8102e;
      --red-2:#e11d33;
      --cyan:#0a74c4;
      --shadow:0 8px 24px rgba(16,24,40,.10);
      --grid:rgba(16,24,40,.03);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 380px at 50% -160px, rgba(225,29,51,.20), transparent 70%),
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 3px),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
  }
  @media (prefers-color-scheme: light){
    body{background:
      radial-gradient(900px 380px at 50% -160px, rgba(200,16,46,.10), transparent 70%),
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 3px),
      var(--bg);}
  }

  /* ---------- header ---------- */
  header{
    position:relative;
    background:linear-gradient(180deg,#0c0d10,#050506);
    border-bottom:1px solid #2a0d12;
    padding:0 16px calc(10px + env(safe-area-inset-top));
    padding-top:0;
    overflow:hidden;
  }
  @media (prefers-color-scheme: light){
    header{background:linear-gradient(180deg,#15171c,#0b0c0f);border-bottom:1px solid #2a0d12;}
  }
  header::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,var(--red),#ff7a3d 45%,var(--red) 100%);
  }
  header::after{
    content:"";
    position:absolute;
    top:0; right:-30px; width:120px; height:100%;
    background:linear-gradient(180deg,rgba(225,29,51,.55),rgba(225,29,51,0));
    transform:skewX(-22deg);
    pointer-events:none;
  }
  .header-inner{
    max-width:640px;margin:0 auto;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:12px;position:relative;z-index:1;
  }
  .mark{width:46px;height:46px;flex:0 0 auto;filter:drop-shadow(0 0 8px rgba(225,29,51,.45))}
  .brand{min-width:0}
  .header-title{
    font-size:13px;font-weight:700;letter-spacing:.08em;
    color:#c9d1dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .header-sub{
    display:flex;align-items:baseline;gap:8px;
    font-family:var(--mono);
    font-size:21px;font-weight:800;letter-spacing:.10em;
    color:#fff;margin-top:1px;
  }
  .header-sub .slash{color:var(--red-2);font-weight:700}
  .unit-line{
    max-width:640px;margin:9px auto 0;position:relative;z-index:1;
    display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
    color:#6f7987;
  }
  .unit-line .dot{color:var(--red-2)}
  .unit-line .live{display:inline-flex;align-items:center;gap:5px}
  .unit-line .live i{
    width:5px;height:5px;border-radius:50%;background:var(--red-2);
    box-shadow:0 0 6px var(--red-2);display:inline-block;
  }

  /* ---------- layout ---------- */
  main{max-width:640px;margin:0 auto;padding:16px 16px 28px}
  .card{
    position:relative;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:16px;
  }
  .card::before,.card::after{
    content:"";position:absolute;width:14px;height:14px;pointer-events:none;
  }
  .card::before{top:-1px;left:-1px;border-top:2px solid var(--red);border-left:2px solid var(--red)}
  .card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--red);border-right:2px solid var(--red)}
  .card-tag{
    position:absolute;top:-9px;left:18px;
    background:var(--red);color:#fff;
    font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.16em;
    padding:2px 7px;
  }

  /* ---------- fields ---------- */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field label{
    display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:700;color:var(--muted);
    margin-bottom:6px;letter-spacing:.02em;line-height:1.35;
  }
  .num{
    flex:0 0 auto;
    font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;
    color:#fff;background:var(--red);padding:1px 4px;border-radius:1px;
  }
  select{
    -webkit-appearance:none;appearance:none;
    width:100%;font:inherit;font-size:16px;font-weight:600;
    color:var(--ink);
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)) , var(--panel);
    border:1px solid var(--line-2);
    border-left:2px solid var(--red);
    border-radius:1px;
    padding:12px 38px 12px 13px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6' fill='none' stroke='%23e11d33' stroke-width='2.4' stroke-linecap='square'/></svg>"),linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0));
    background-repeat:no-repeat,no-repeat;
    background-position:right 11px center,0 0;
    background-size:16px,100% 100%;
    background-color:var(--panel);
  }
  @media (prefers-color-scheme: light){
    select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6' fill='none' stroke='%23c8102e' stroke-width='2.4' stroke-linecap='square'/></svg>"),linear-gradient(180deg,rgba(16,24,40,.02),rgba(16,24,40,0));}
  }
  select:disabled{opacity:.4}
  select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 2px rgba(225,29,51,.22)}

  /* ---------- result ---------- */
  .result-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-bottom:9px;margin-bottom:4px;
    border-bottom:1px solid var(--line-2);
  }
  .result-head h2{
    margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--ink);
    display:flex;align-items:center;gap:7px;
  }
  .result-head h2::before{
    content:"";width:3px;height:14px;background:var(--red);display:inline-block;
  }
  .result-head h2 small{
    font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);font-weight:700;
  }
  .readout{
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%;
  }
  .empty{
    margin:0;padding:34px 12px;color:var(--muted);
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-align:center;
  }
  .empty::before{content:"> ";color:var(--red-2)}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  thead th{
    font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.16em;
    color:var(--muted);padding:9px 6px 7px;
    border-bottom:1px solid var(--red);
    white-space:nowrap;text-transform:uppercase;
  }
  tbody td{
    padding:9px 6px;border-bottom:1px solid var(--line);
    text-align:right;font-family:var(--mono);font-size:15px;font-weight:700;
    white-space:nowrap;
  }
  tbody tr:nth-child(even) td{background:rgba(255,255,255,.018)}
  @media (prefers-color-scheme: light){ tbody tr:nth-child(even) td{background:rgba(16,24,40,.025)} }
  tbody tr:last-child td{border-bottom:none}
  thead th:first-child,tbody td:first-child{text-align:left;color:var(--muted);font-weight:700}
  td.ev-plus{color:var(--cyan)}
  td.ev-minus{color:var(--red-2)}
  tr.best td{background:rgba(225,29,51,.13)!important}
  tr.best td:first-child{box-shadow:inset 3px 0 0 var(--red-2)}
  .best-mark{
    font-size:9px;font-weight:800;letter-spacing:.1em;color:#fff;
    background:var(--red);padding:1px 4px;margin-left:6px;vertical-align:2px;
  }
  .note{
    margin:12px 0 0;padding:10px 12px;
    background:rgba(225,29,51,.09);
    border-left:2px solid var(--red);
    font-size:12.5px;line-height:1.7;color:var(--ink);
  }
  .note b{color:var(--red-2)}

  /* ---------- doc ---------- */
  .doc h3{
    display:flex;align-items:center;gap:8px;
    margin:22px 0 10px;font-size:14px;font-weight:800;letter-spacing:.02em;
    color:var(--ink);
  }
  .doc h3::before{
    content:"";width:4px;height:16px;background:var(--red);flex:0 0 auto;
  }
  .doc h3:first-child{margin-top:2px}
  .doc h4{
    margin:16px 0 6px;font-size:13px;font-weight:800;
    color:var(--red-2);letter-spacing:.03em;
  }
  .doc p{margin:0 0 9px;font-size:14px;line-height:1.8}
  .doc ul{margin:0 0 9px;padding-left:1.1em}
  .doc li{font-size:14px;line-height:1.8;margin-bottom:4px}
  .doc li::marker{color:var(--red)}
  .doc .small{font-size:12.5px;color:var(--muted);line-height:1.75}
  .doc b{font-weight:800}

  .foot{
    max-width:640px;margin:0 auto;padding:0 16px 26px;
    display:flex;justify-content:space-between;gap:10px;
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);
    opacity:.8;
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <polygon points="24,2 43,13 43,35 24,46 5,35 5,13" fill="none" stroke="#ff3b4f" stroke-width="1.6"/>
      <polygon points="24,9 37,16.5 37,31.5 24,39 11,31.5 11,16.5" fill="rgba(225,29,51,.16)" stroke="rgba(255,59,79,.55)" stroke-width="1"/>
      <path d="M17 19h4l3 8 3-8h4l-5 12h-4z" fill="#fff"/>
      <path d="M31 24h9" stroke="#ff3b4f" stroke-width="1" opacity=".7"/>
    </svg>
    <div class="brand">
      <div class="header-title">L 革命機ヴァルヴレイヴ2</div>
      <div class="header-sub"><span class="slash">//</span>V2 ANALYZER</div>
    </div>
  </div>
  <div class="unit-line">
    <span>UNIT&nbsp;02 <span class="dot">/</span> ANALYSIS TERMINAL</span>
    <span class="live"><i></i>STANDBY</span>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-tag">INPUT</div>
    <div class="field">
      <label for="kou"><span class="num">01</span>項目</label>
      <select id="kou">
        <option value="">選択してください</option>
        <option value="基本情報">基本情報</option>
        <option value="最強区間 期待値表">最強区間 期待値表</option>
      </select>
    </div>

    <div class="field">
      <label for="bbs"><span class="num">02</span>朝イチからの累計革命ボーナス成功回数</label>
      <select id="bbs" disabled></select>
    </div>
    <div class="field">
      <label for="bbf"><span class="num">03</span>朝イチからの累計革命ボーナス失敗回数</label>
      <select id="bbf" disabled></select>
    </div>
    <div class="field">
      <label for="set"><span class="num">04</span>朝イチからの累計革命RUSHセット数</label>
      <select id="set" disabled></select>
    </div>
  </section>

  <section class="card">
    <div class="card-tag">OUTPUT</div>
    <div class="result-head">
      <h2>解析結果 <small>RESULT</small></h2>
      <span class="readout" id="resultSub"></span>
    </div>
    <div id="result">
      <p class="empty">SELECT INPUT</p>
    </div>
  </section>
</main>

<div class="foot">
  <span>V2 ANALYZER</span>
  <span>PRIVATE BUILD v1.0</span>
</div>
